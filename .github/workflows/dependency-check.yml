name: Dependency & Security Check

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  NODE_VERSION: '20'
  # Vulnerability SLA policy (#832) - see docs/security/dependency-vulnerability-sla.md
  VULN_FAIL_ON: high
  VULN_WARN_ON: moderate
  VULN_SLA_DAYS: critical=7,high=30,moderate=90,low=180

jobs:
  npm-audit:
    name: PNPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Test vulnerability SLA gate
        run: pnpm run test:dependency-sla

      # pnpm exits non-zero whenever advisories exist, so its status is ignored here;
      # the SLA gate decides pass/warn/fail and fails closed on empty or invalid output.
      - name: Run pnpm audit (production dependencies)
        run: pnpm audit --prod --json > audit-prod.json || true

      - name: Enforce vulnerability SLAs
        run: node scripts/dependency-vulnerability-sla.mjs --input audit-prod.json

      - name: Generate full audit report
        if: always()
        run: pnpm audit --json > audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: |
            audit-report.json
            audit-prod.json
          if-no-files-found: warn
          retention-days: 30

  outdated-check:
    name: Outdated Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Check outdated packages
        run: |
          echo "## Outdated Dependencies" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          pnpm outdated || true >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
