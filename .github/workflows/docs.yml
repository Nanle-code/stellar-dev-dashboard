name: Deploy API Documentation

on:
push:
branches:
- master
paths:
- 'docs/**'
- 'docs-site/**'
- 'src/lib/**'
pull_request:
branches:
- master
paths:
- 'docs/**'
- 'docs-site/**'
- 'src/lib/**'
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: pages
cancel-in-progress: false

jobs:
generate-api-docs:
name: Generate API Reference
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v7

```
  - name: Setup pnpm
    uses: pnpm/action-setup@v4
    with:
      version: 9

  - name: Setup Node.js
    uses: actions/setup-node@v6
    with:
      node-version: '20'
      cache: 'pnpm'
      cache-dependency-path: pnpm-lock.yaml

  - name: Install root dependencies
    run: pnpm install --frozen-lockfile

  - name: Regenerate API reference from JSDoc
    run: pnpm run docs:api:generate

  - name: Upload generated docs
    uses: actions/upload-artifact@v7
    with:
      name: generated-api-docs
      path: docs/api/generated/
      retention-days: 1
```

validate-docs-drift:
name: Validate Docs Drift
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v7

```
  - name: Setup pnpm
    uses: pnpm/action-setup@v4
    with:
      version: 9

  - name: Setup Node.js
    uses: actions/setup-node@v6
    with:
      node-version: '20'
      cache: 'pnpm'
      cache-dependency-path: pnpm-lock.yaml

  - name: Install root dependencies
    run: pnpm install --frozen-lockfile

  - name: Validate documentation drift
    run: pnpm run docs:validate-drift
```

validate-examples:
name: Validate Example Scripts
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v7

```
  - name: Setup pnpm
    uses: pnpm/action-setup@v4
    with:
      version: 9

  - name: Setup Node.js
    uses: actions/setup-node@v6
    with:
      node-version: '20'
      cache: 'pnpm'
      cache-dependency-path: pnpm-lock.yaml

  - name: Install root dependencies
    run: pnpm install --frozen-lockfile

  - name: Check JS examples syntax
    run: |
      for f in docs/api/examples/js/*.mjs docs/api/examples/js/*.js; do
        echo "Checking: $f"
        node --check "$f"
      done

  - name: Setup Python
    uses: actions/setup-python@v7
    with:
      python-version: '3.11'

  - name: Check Python examples syntax
    run: |
      for f in docs/api/examples/python/*.py; do
        echo "Checking: $f"
        python -m py_compile "$f"
      done
```

build-docs-site:
name: Build Docusaurus
runs-on: ubuntu-latest
needs: [generate-api-docs]

```
steps:
  - name: Checkout
    uses: actions/checkout@v7

  - name: Download generated docs
    uses: actions/download-artifact@v8
    with:
      name: generated-api-docs
      path: docs/api/generated/

  - name: Setup pnpm
    uses: pnpm/action-setup@v4
    with:
      version: 9

  - name: Setup Node.js
    uses: actions/setup-node@v6
    with:
      node-version: '20'
      cache: 'pnpm'
      cache-dependency-path: docs-site/pnpm-lock.yaml

  - name: Install Docusaurus dependencies
    run: pnpm install --frozen-lockfile
    working-directory: docs-site

  - name: Build Docusaurus site
    run: pnpm run build
    working-directory: docs-site
    env:
      NODE_ENV: production

  - name: Upload Pages artifact
    uses: actions/upload-pages-artifact@v5
    with:
      path: docs-site/build/
```

deploy-docs:
name: Deploy to GitHub Pages
runs-on: ubuntu-latest
needs: build-docs-site
if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'

```
environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

steps:
  - name: Deploy to GitHub Pages
    id: deployment
    uses: actions/deploy-pages@v5
```
