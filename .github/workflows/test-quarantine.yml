name: Flaky Test Quarantine & Triage

on:
  push:
    branches: [master, main, develop]
    paths:
      - '.github/test-quarantine.json'
      - 'scripts/flaky-test-quarantine.mjs'
  pull_request:
    branches: [master, main, develop]
    paths:
      - '.github/test-quarantine.json'
      - 'scripts/flaky-test-quarantine.mjs'
  schedule:
    # Daily quarantine health audit and isolated pass streak verification — 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Quarantine Action to execute'
        required: true
        default: 'audit'
        type: choice
        options:
          - audit
          - verify-quarantined
          - generate-report

concurrency:
  group: test-quarantine-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quarantine-audit:
    name: Quarantine Registry & Owner Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Quarantine Policy & Owner Enforcement
        run: node scripts/flaky-test-quarantine.mjs --check

      - name: Generate Quarantine Triage Report
        run: node scripts/flaky-test-quarantine.mjs --report

      - name: Run Quarantine Manager Unit Tests
        run: pnpm test tests/unit/flaky-test-quarantine.test.ts

  isolated-quarantine-verify:
    name: Isolated Quarantined Test Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Quarantined Tests in Isolation
        continue-on-error: true
        run: |
          FILTER=$(node scripts/flaky-test-quarantine.mjs --filter)
          if [ -n "$FILTER" ]; then
            echo "Executing quarantined tests under filter: $FILTER"
            pnpm vitest run --testNamePattern "$FILTER" || true
          else
            echo "No active quarantined tests to verify."
          fi
