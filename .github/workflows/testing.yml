name: Comprehensive Testing Framework

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]
  schedule:
    # Mutation testing weekly — Sunday 08:00 UTC
    - cron: '0 8 * * 0'
  workflow_dispatch:

concurrency:
  group: testing-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # Step 1 — Visual regression (multi-viewport Playwright + optional Chromatic)
  # ══════════════════════════════════════════════════════════════════════════
  visual-regression:
    name: Visual Regression (${{ matrix.viewport }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        viewport: [mobile, tablet, desktop, wide]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Build production bundle
        run: npm run build

      - name: Restore visual baselines
        uses: actions/cache@v6
        with:
          path: tests/e2e/snapshots
          key: visual-snapshots-${{ matrix.viewport }}-${{ github.base_ref || github.ref_name }}
          restore-keys: visual-snapshots-${{ matrix.viewport }}-

      - name: Run visual tests (${{ matrix.viewport }})
        run: npx playwright test --project=visual-${{ matrix.viewport }}
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173

      - name: Upload diff on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff-${{ matrix.viewport }}-${{ github.run_number }}
          path: |
            tests/e2e/report/
            test-results/
          retention-days: 14

      - name: Save baselines
        if: success()
        uses: actions/cache/save@v6
        with:
          path: tests/e2e/snapshots
          key: visual-snapshots-${{ matrix.viewport }}-${{ github.base_ref || github.ref_name }}

  chromatic:
    name: Chromatic (Storybook)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || vars.CHROMATIC_ENABLED == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build-storybook

      - name: Run Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: storybook-static
          exitZeroOnChanges: true

  # ══════════════════════════════════════════════════════════════════════════
  # Step 2 — Mutation testing (Stryker)
  # ══════════════════════════════════════════════════════════════════════════
  mutation-testing:
    name: Mutation Testing (Stryker)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run Stryker mutation tests
        run: npx stryker run

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report
          path: reports/
          retention-days: 30

  # ══════════════════════════════════════════════════════════════════════════
  # Step 3 — Coverage thresholds and reports
  # ══════════════════════════════════════════════════════════════════════════
  coverage-gate:
    name: Coverage Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage || true

      - name: Enforce coverage thresholds
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node scripts/check-coverage.mjs
          else
            echo "::warning::Coverage summary not generated — skipping threshold check."
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/
          retention-days: 30

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              console.log('| Metric | Coverage |');
              console.log('|--------|----------|');
              for (const m of ['lines','functions','branches','statements']) {
                console.log('| ' + m + ' | ' + s[m].pct + '% |');
              }
            " >> "$GITHUB_STEP_SUMMARY"
          fi

  # ══════════════════════════════════════════════════════════════════════════
  # Step 4 — Lighthouse CI performance budgets
  # ══════════════════════════════════════════════════════════════════════════
  lighthouse-ci:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch full history for regression correlation

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 30

      # ── Predictive Performance Regression Detection (#624) ─────────────────
      # Analyzes Lighthouse metrics against historical baselines to detect
      # performance regressions before they impact users. Uses statistical
      # z-score analysis with 2.5σ threshold and correlates findings with
      # recent git commits for root cause investigation.
      #
      # Exit behavior:
      #   - High-confidence regressions (confidence ≥ 0.5): Fails CI (exit 1)
      #   - Low-confidence regressions: Logs warning, CI passes (exit 0)
      #   - No regressions: CI passes (exit 0)
      - name: Detect performance regressions
        if: always()  # Run even if Lighthouse CI fails
        run: |
          if [ -d .lighthouseci ]; then
            node scripts/detect-performance-regressions.mjs --threshold=2.5 --verbose
          else
            echo "Lighthouse CI results not found - skipping regression detection."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}

  # ══════════════════════════════════════════════════════════════════════════
  # Step 5 — Accessibility gate (axe-core)
  # ══════════════════════════════════════════════════════════════════════════
  accessibility-gate:
    name: Accessibility Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run accessibility gate
        run: npm run test:a11y
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4173

      - name: Upload a11y report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-report
          path: tests/e2e/report/
          retention-days: 14

  # ══════════════════════════════════════════════════════════════════════════
  # Testing framework summary gate
  # ══════════════════════════════════════════════════════════════════════════
  testing-gate:
    name: Testing Framework Gate
    runs-on: ubuntu-latest
    needs: [visual-regression, coverage-gate, lighthouse-ci, accessibility-gate]
    if: always()
    steps:
      - name: Summarize testing pipeline
        run: |
          echo "## Testing Framework Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Stage | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"

          VISUAL="${{ needs.visual-regression.result }}"
          COVERAGE="${{ needs.coverage-gate.result }}"
          LHCI="${{ needs.lighthouse-ci.result }}"
          A11Y="${{ needs.accessibility-gate.result }}"

          echo "| Visual Regression | $VISUAL |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Coverage Gate | $COVERAGE |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lighthouse CI | $LHCI |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Accessibility Gate | $A11Y |" >> "$GITHUB_STEP_SUMMARY"

          FAILED=0
          FAIL_LIST=()

          if [ "$VISUAL" = "failure" ] || [ "$VISUAL" = "cancelled" ]; then
            FAILED=1; FAIL_LIST+=("Visual Regression")
          fi
          if [ "$COVERAGE" = "failure" ] || [ "$COVERAGE" = "cancelled" ]; then
            FAILED=1; FAIL_LIST+=("Coverage Gate")
          fi
          if [ "$LHCI" = "failure" ] || [ "$LHCI" = "cancelled" ]; then
            FAILED=1; FAIL_LIST+=("Lighthouse CI")
          fi
          if [ "$A11Y" = "failure" ] || [ "$A11Y" = "cancelled" ]; then
            FAILED=1; FAIL_LIST+=("Accessibility Gate")
          fi

          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Testing framework gate failed. Failed stages: ${FAIL_LIST[*]}"
            exit 1
          fi
